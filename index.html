<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Student Registration System using JavaScript DOM Manipulation">
    <title>Student Registration Form System</title>
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <header class="header">
        <h1>Student Registration Form</h1>
    </header>

    <!-- Main Container -->
    <main class="container">

        <!-- Registration Form -->
        <section class="form-section">
            <h2>Register Student</h2>
            <form id="studentForm">
                <div class="form-group">
                    <label for="studentId">Student ID</label>
                    <input type="text" id="studentId" placeholder="Enter Student ID">
                </div>
                <div class="form-group">
                    <label for="name">Student Name</label>
                    <input type="text" id="name" placeholder="Enter Student Name">
                </div>
                <div class="form-group">
                    <label for="email">Enter Email ID</label>
                    <input type="email" id="email" placeholder="Enter Email">
                </div>
                <div class="form-group">
                    <label for="contact">Enter Contact Number</label>
                    <input type="text" id="contact" placeholder="Enter Contact Number">
                </div>
                <button type="submit" id="submitBtn">Submit Your Form</button>
            </form>
        </section>

        <!-- Display Section -->
        <section class="display-section">
            <h2>Registered Students</h2>
            <div class="table-container">
                <table id="studentTable">
                    <thead>
                        <tr>
                            <th>Student Name</th>
                            <th>Student ID</th>
                            <th>Email ID</th>
                            <th>Contact No</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Rows will be added by JavaScript -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- JavaScript at the bottom -->
    <script src="script.js"></script>
</body>
</html>
